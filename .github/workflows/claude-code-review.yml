name: Claude code review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write
  id-token: write

# A rapid re-push should supersede the in-flight review rather than post twice.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    # Advisory, not a gate. A reviewer that cannot reach the API (expired token, empty
    # credit balance, provider outage) says nothing about the change under review, so it
    # must not be what blocks a merge. Read the job log when the review is missing.
    continue-on-error: true
    # Dependabot bumps are lockfile-only, so reviewing them just burns tokens.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    steps:
      # Keeps the job green (and silent) until the token is added to the repo secrets,
      # instead of turning every PR red with an auth failure. A pull request from a fork
      # cannot see the secret either, so this covers that case too.
      - name: Check for a token
        id: key
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: echo "present=${CLAUDE_CODE_OAUTH_TOKEN:+true}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        if: steps.key.outputs.present == 'true'
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        if: steps.key.outputs.present == 'true'
        with:
          # `claude setup-token` issues an OAuth token (sk-ant-oat01-...) that runs on the
          # Claude subscription. It is not an API key and is rejected by the x-api-key
          # header, so it has to go through this input rather than anthropic_api_key.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. The PR branch is already checked out in the working
            directory.

            scc is a static compliance checker for SPIFFE artifacts. It takes a SPIFFE ID, an
            X.509-SVID, a JWT-SVID or a trust bundle and reports which MUST and MUST NOT clauses from
            the SPIFFE specifications the artifact satisfies, citing the document and section behind
            every line. Code lives in internal/{bundle,id,jose,jwtsvid,witsvid,x509svid,spec,report}.

            Focus on:
            - A false PASS is far worse than a false FAIL. It tells someone a non-compliant artifact
              is fine, which is the opposite of the tool's purpose. Weight the review accordingly.
            - Every check has to cite a real clause in the SPIFFE specs. A check whose citation is
              paraphrased, points at the wrong section, or asserts something stricter than the spec
              says is a defect even when the code is correct.
            - Scope is deliberately static: the shape of the artifact. Workload attestation, key
              rotation, Workload API endpoint behaviour and signature verification against a
              particular bundle are out of scope, so a change that starts doing them is scope creep
              worth naming.
            - Parsers take untrusted input by definition. A malformed certificate, token or bundle
              must produce a finding, not a panic.
            - SPIFFE ID rules are easy to get subtly wrong: scheme, trust domain charset and case,
              path segments, and the absence of a port or userinfo.

            Report only what you can point at in the diff. Do not restate what the change
            does, do not praise it, and skip nits that golangci-lint would already catch. If the
            change looks sound, say so in one line rather than inventing findings.

            Use `gh pr comment` for top-level feedback.
            Use `mcp__github_inline_comment__create_inline_comment` (with `confirmed: true`)
            to point at specific lines.
            Only post GitHub comments, do not return the review as a message.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
