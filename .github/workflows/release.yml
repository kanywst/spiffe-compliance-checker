name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write            # keyless cosign signing needs an OIDC token

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: goreleaser
    runs-on: ubuntu-latest
    steps:
      - name: harden runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0           # goreleaser uses full history for changelog
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # syft generates the per-archive SBOMs, cosign signs checksums.txt. Both
      # are invoked by goreleaser, so they only need to be on PATH.
      - uses: anchore/sbom-action/download-syft@v0

      # No moving major tag is published for this action, so pin the exact
      # release and let Dependabot bump it.
      - uses: sigstore/cosign-installer@v4.1.2

      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
