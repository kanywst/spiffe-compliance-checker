version: 2

project_name: spiffe-compliance-checker

before:
  hooks:
    - go mod tidy

builds:
  - id: scc
    main: ./cmd/scc
    binary: scc
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}

archives:
  - id: default
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    files:
      - README.md
      - README.ja.md
      - LICENSE

checksum:
  name_template: "checksums.txt"

# One SPDX SBOM per archive, generated by syft. The release workflow installs
# syft; goreleaser's default invocation is left alone so it stays in step with
# whatever syft CLI that action ships.
sboms:
  - id: archives
    artifacts: archive

# Keyless cosign signature over checksums.txt. Signing the checksum file rather
# than each archive is enough to cover them all: the file names every artifact
# by digest, so verifying the signature and then the digest chains trust to the
# binary. Keyless means no long-lived key — the identity is the workflow itself,
# recorded in Rekor, which is why the job needs id-token: write.
#
# The signature is a Sigstore bundle (certificate and signature in one file).
# cosign 3 deprecated the older --output-signature / --output-certificate pair
# and errors out unless --bundle is given, so there is no two-file variant to
# fall back to.
signs:
  - id: checksums
    cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: github-native

release:
  github:
    owner: kanywst
    name: spiffe-compliance-checker
  draft: false
  prerelease: auto
  # Lets a partially-failed release be re-run. Without this, re-uploading an
  # asset that is already on the release fails with a 422 and goreleaser aborts
  # before it gets to the Homebrew step.
  replace_existing_artifacts: true

# Formula (not Cask) to match the kanywst/homebrew-tap convention
# documented in its README: "Formula (CLI / TUI binaries), Cask (GUI apps)".
# GoReleaser flags the `brews:` block as deprecated in favor of
# `homebrew_casks:`, but the block still works and matches what `approval-hub`
# already does in the same tap.
brews:
  - name: spiffe-compliance-checker
    repository:
      owner: kanywst
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/kanywst/spiffe-compliance-checker
    description: Static MUST-clause compliance checker for SPIFFE artifacts (SPIFFE-ID, X.509-SVID, JWT-SVID, WIT-SVID, trust bundle, bundle map).
    license: Apache-2.0
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    commit_msg_template: "chore(spiffe-compliance-checker): bump to {{ .Tag }}"
    directory: Formula
    install: |
      bin.install "scc"
    test: |
      system "#{bin}/scc", "--version"
